name: Build APK
on:
  workflow_dispatch:
    inputs:
      app_name:
        required: true
      package_id:
        required: true
      version:
        required: true
        default: "1.0.0"
      build_type:
        required: true
        default: "release"
      zip_path:
        required: true
      chat_id:
        required: true
        default: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Install Cordova
        run: npm install -g cordova@12
      - name: Extract ZIP
        run: |
          mkdir -p src
          unzip -o "${{ github.event.inputs.zip_path }}" -d src
          if [ ! -f src/index.html ]; then
            f=$(find src -name index.html | head -1)
            if [ -n "$f" ]; then mv "$(dirname "$f")"/* src/ 2>/dev/null || true; fi
          fi
      - name: Cordova Create
        run: |
          cordova create app "${{ github.event.inputs.package_id }}" "${{ github.event.inputs.app_name }}"
          rm -rf app/www/*
          cp -r src/* app/www/
          cd app
          cordova platform add android --no-telemetry
          sed -i "s/version=\"[^\"]*\"/version=\"${{ github.event.inputs.version }}\"/" config.xml
      - name: Build APK
        run: |
          cd app
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            cordova build android --release --no-telemetry
          else
            cordova build android --debug --no-telemetry
          fi
          APK=$(find platforms/android -name "*.apk" | head -1)
          cp "$APK" ../app.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: app.apk
      - name: Kirim ke Telegram
        if: ${{ github.event.inputs.chat_id != '0' }}
        env:
          BOT: ${{ secrets.BOT_TOKEN }}
          CHAT: ${{ github.event.inputs.chat_id }}
        run: |
          curl -s -F chat_id="$CHAT" \
               -F document=@app.apk \
               -F caption="✅ APK ${{ github.event.inputs.app_name }} siap" \
               "https://api.telegram.org/bot${BOT}/sendDocument"
